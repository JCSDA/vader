recipe:
  recipe name: NorthwardWindAt10m_A
model data:
  levels_are_top_down: true
  nLevels: 3
columns:
  # Top-down levels: the lowest model level is the last one (4.0). The other levels
  # differ so that picking the wrong level fails the test.
  northward_wind: [-6.0, -2.0, 4.0]
  ratio_of_wind_at_10m_to_wind_at_surface_adjacent_layer: [0.5]
expected:
  # v10 = ratio * v(lowest level) = 0.5 * 4.0
  northward_wind_at_10m: [2.0]
nonlinear test tolerance: 1.e-12
