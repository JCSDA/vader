recipe:
  recipe name: EastwardWindAt10m_A
model data:
  levels_are_top_down: true
  nLevels: 3
columns:
  # Top-down levels: the lowest model level is the last one (3.0). The other levels
  # differ so that picking the wrong level fails the test.
  eastward_wind: [5.0, 7.0, 3.0]
  ratio_of_wind_at_10m_to_wind_at_surface_adjacent_layer: [0.5]
expected:
  # u10 = ratio * u(lowest level) = 0.5 * 3.0
  eastward_wind_at_10m: [1.5]
nonlinear test tolerance: 1.e-12
