vader: {}
plan variable tests:
# Empty test
- cookbook:
    TestVarA: [Test_VarA_from_B,Test_VarA_from_C_D]
    TestVarB: [Test_VarB_from_E,Test_VarB_from_A]
    TestVarC: [Test_VarC_from_F]
  ingredients: []
  products: []
  plan for TLAD: true
  expected planned products: []
  expected recipe plan: []
  expected traj recipe plan: []
# One ingredient which is available
- cookbook:
    TestVarA: [Test_VarA_from_B,Test_VarA_from_C_D]
    TestVarB: [Test_VarB_from_E,Test_VarB_from_A]
    TestVarC: [Test_VarC_from_F]
  ingredients: [TestVarB]
  products: [TestVarA]
  plan for TLAD: false
  expected planned products: [TestVarA]
  expected recipe plan: [Test_VarA_from_B]
# One ingredient which doesn't match any recipe
- cookbook:
    TestVarA: [Test_VarA_from_B,Test_VarA_from_C_D]
    TestVarB: [Test_VarB_from_E,Test_VarB_from_A]
    TestVarC: [Test_VarC_from_F]
  ingredients: [TestVarZ]
  products: [TestVarA]
  plan for TLAD: false
  expected planned products: []
  expected recipe plan: []
# Two ingredients which match 2nd recipe for product
- cookbook:
    TestVarA: [Test_VarA_from_B,Test_VarA_from_C_D]
    TestVarB: [Test_VarB_from_E,Test_VarB_from_A]
    TestVarC: [Test_VarC_from_F]
  ingredients: [TestVarC,TestVarD]
  products: [TestVarA]
  plan for TLAD: false
  expected planned products: [TestVarA]
  expected recipe plan: [Test_VarA_from_C_D]
# Two matching recipes - first one listed in cookbook should be used
- cookbook:
    TestVarA: [Test_VarA_from_B,Test_VarA_from_C_D]
    TestVarB: [Test_VarB_from_E,Test_VarB_from_A]
    TestVarC: [Test_VarC_from_F]
  ingredients: [TestVarB,TestVarC,TestVarD]
  products: [TestVarA]
  plan for TLAD: false
  expected planned products: [TestVarA]
  expected recipe plan: [Test_VarA_from_B]
# Recursion needed to get an ingredient
- cookbook:
    TestVarA: [Test_VarA_from_B,Test_VarA_from_C_D]
    TestVarB: [Test_VarB_from_E,Test_VarB_from_A]
    TestVarC: [Test_VarC_from_F]
  ingredients: [TestVarE]
  products: [TestVarA]
  plan for TLAD: false
  expected planned products: [TestVarB,TestVarA]
  expected recipe plan: [Test_VarB_from_E,Test_VarA_from_B]
# Ingredient variable in both ingredients and products
- cookbook:
    TestVarA: [Test_VarA_from_B,Test_VarA_from_C_D]
    TestVarB: [Test_VarB_from_E,Test_VarB_from_A]
    TestVarC: [Test_VarC_from_F]
  ingredients: [TestVarC,TestVarD]
  products: [TestVarA,TestVarC]
  plan for TLAD: false
  expected planned products: [TestVarA,TestVarC]
  expected recipe plan: [Test_VarA_from_C_D]
# Can't use first recipe due to missing TL/AD algorithm
- cookbook:
    TestVarA: [Test_VarA_from_B,Test_VarA_from_G]
    TestVarB: [Test_VarB_from_E,Test_VarB_from_A]
    TestVarC: [Test_VarC_from_F]
  ingredients: [TestVarA,TestVarE]
  products: [TestVarB]
  trajectory variables: [TestVarA]
  plan for TLAD: true
  expected planned products: [TestVarB]
  expected recipe plan: [Test_VarB_from_A]
  expected traj recipe plan: []
# Can't use recipe due to missing trajectory variable
- cookbook:
    TestVarA: [Test_VarA_from_B,Test_VarA_from_G]
    TestVarB: [Test_VarB_from_E,Test_VarB_from_A]
    TestVarC: [Test_VarC_from_F]
  ingredients: [TestVarA,TestVarE]
  products: [TestVarB]
  trajectory variables: []
  plan for TLAD: true
  expected planned products: []
  expected recipe plan: []
  expected traj recipe plan: []
# Need to produce missing trajectory variable
- cookbook:
    TestVarA: [Test_VarA_from_B,Test_VarA_from_G]
    TestVarB: [Test_VarB_from_E,Test_VarB_from_A]
    TestVarC: [Test_VarC_from_F]
  ingredients: [TestVarA,TestVarE]
  products: [TestVarB]
  trajectory variables: [TestVarE]
  plan for TLAD: true
  expected planned products: [TestVarB]
  expected recipe plan: [Test_VarB_from_A]
  expected traj recipe plan: [Test_VarB_from_E,Test_VarA_from_B]
# Can't use first recipe due to missing NL algorithm
- cookbook:
    TestVarA: [Test_VarA_from_G,Test_VarA_from_B]
    TestVarB: [Test_VarB_from_E,Test_VarB_from_A]
    TestVarC: [Test_VarC_from_F]
  ingredients: [TestVarB,TestVarG]
  products: [TestVarA]
  plan for TLAD: false
  expected planned products: [TestVarA]
  expected recipe plan: [Test_VarA_from_B]
  expected traj recipe plan: []
# First req'd ingredient can be produced, but not second, so remove first recipe
- cookbook:
    TestVarA: [Test_VarA_from_C_D]
    TestVarB: [Test_VarB_from_E,Test_VarB_from_A]
    TestVarC: [Test_VarC_from_F]
  ingredients: [TestVarF]
  products: [TestVarA]
  plan for TLAD: false
  expected planned products: []
  expected recipe plan: []
# First req'd traj var can be produced, but not second, so remove first recipe
- cookbook:
    TestVarA: [Test_VarA_from_C_D]
    TestVarB: [Test_VarB_from_E,Test_VarB_from_A]
    TestVarC: [Test_VarC_from_F]
  ingredients: [TestVarA]
  products: [TestVarB]
  trajectory variables: [TestVarC]
  plan for TLAD: true
  expected planned products: []
  expected recipe plan: []
  expected traj recipe plan: []
# Need to produce intermediate missing trajectory variable in a low level recipe
- cookbook:
    TestVarA: [Test_VarA_from_B_C] # produces A, needs ingredients B, C,   no traj
    TestVarC: [Test_VarC_from_D_E] # produces C, needs ingredients D, E,   traj D, E
    TestVarE: [Test_VarE_from_F]   # produces E, needs ingredients F,      traj F
  ingredients: [TestVarB, TestVarD, TestVarF] # available ingredients
  products: [TestVarA]
  trajectory variables: [TestVarD, TestVarF]  # available trajectory variables
  plan for TLAD: true
  expected planned products: [TestVarA, TestVarC, TestVarE]
  expected recipe plan: [Test_VarE_from_F, Test_VarC_from_D_E, Test_VarA_from_B_C]
  expected traj recipe plan: [Test_VarE_from_F]
# Need to produce intermediate missing trajectory variable in a low level recipe
# but last recipe fails due to missing ingredient
- cookbook:
    TestVarA: [Test_VarA_from_B_C] # produces A, needs ingredients B, C,   no traj
    TestVarC: [Test_VarC_from_D_E] # produces C, needs ingredients D, E,   traj D, E
    TestVarE: [Test_VarE_from_F]   # produces E, needs ingredients F,      traj F
  ingredients: [TestVarB, TestVarD] # available ingredients
  products: [TestVarA]
  trajectory variables: [TestVarD]  # available trajectory variables
  plan for TLAD: true
  expected planned products: []
  expected recipe plan: []
  expected traj recipe plan: []
  # can produce first trajectory ingredient variable via a recipe, but second trajectory ingredient
# variable cannot be produced
- cookbook:
    TestVarB: [Test_VarB_from_A] # produces B, needs ingredient A,   traj A
    TestVarA: [Test_VarA_from_C_D] # produces A, needs ingredients C, D,   no traj
    TestVarC: [Test_VarC_from_F]   # produces C, needs ingredients F,      no traj
  ingredients: [TestVarA] # available ingredients
  products: [TestVarB]
  trajectory variables: [TestVarF]  # available trajectory variables
  plan for TLAD: true
  expected planned products: []
  expected recipe plan: []
  expected traj recipe plan: []
