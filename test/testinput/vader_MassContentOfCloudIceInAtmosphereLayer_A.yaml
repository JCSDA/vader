vader: {}
trajectory grid:
  type : regular_gaussian
  N : 12
cookbook:
  mass_content_of_cloud_ice_in_atmosphere_layer: [MassContentOfCloudIceInAtmosphereLayer_A]
  cloud_liquid_ice: [CloudLiquidIce_A]
  air_pressure_at_surface: [SurfaceAirPressure_A]
  air_pressure_thickness: [AirPressureThickness_A]
model data:
  air_pressure_at_top_of_atmosphere_model: 10
  standard_gravitational_acceleration: 9.80665
  levels_are_top_down: false
  nLevels: 70
trajectory filename: testdata/gauss_state_F12.nc
trajectory variables:
  - air_temperature
  - air_pressure
  - relative_humidity
  - air_pressure_levels
ingredients:
  - air_temperature
  - air_pressure
  - relative_humidity
  - air_pressure_levels
products:
  - mass_content_of_cloud_ice_in_atmosphere_layer
  - cloud_liquid_ice
  - air_pressure_at_surface
  - air_pressure_thickness
adjoint test tolerance: 1.e-7
