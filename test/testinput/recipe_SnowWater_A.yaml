recipe:
  recipe name: SnowWater_A
trajectory grid:
  type : regular_gaussian
  N : 12
trajectory filename: testdata/gauss_state_F12.nc
adjoint test tolerance: 1.e-12
# TL is exact within the active region, but points near the T<T_freeze / RH>RH_crit activation
# boundaries contribute O(alpha) residuals → test shows O(alpha^1.3) rather than O(alpha^2).
run tangent linear test: false
model data:
  air_pressure_at_top_of_atmosphere_model: 10.0
